name: telecom-incident-agent

x-app-environment: &app-environment
  TELECOM_AGENT_DATA_DIR: /data
  TELECOM_DATABASE_URL: postgresql://telecom:${POSTGRES_PASSWORD:-telecom-local-only}@postgres:5432/telecom
  TELECOM_REDIS_URL: redis://redis:6379/0

services:
  incident-api:
    build: .
    environment: *app-environment
    ports:
      - "8000:8000"
    volumes:
      - telecom-agent-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10

  runtime-worker:
    build: .
    command: ["python", "-m", "telecom_incident_agent.worker"]
    environment:
      <<: *app-environment
      TELECOM_WORKER_METRICS_PORT: "9000"
    volumes:
      - telecom-agent-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/metrics', timeout=3)"]
      interval: 10s
      timeout: 4s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: telecom
      POSTGRES_USER: telecom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telecom-local-only}
    volumes:
      - telecom-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telecom -d telecom"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - telecom-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - telecom-prometheus-data:/prometheus
    depends_on:
      incident-api:
        condition: service_healthy
      runtime-worker:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-telecom-local-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - telecom-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  telecom-agent-data:
  telecom-postgres-data:
  telecom-redis-data:
  telecom-prometheus-data:
  telecom-grafana-data:
