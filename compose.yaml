services:
  incident-api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - telecom-agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  telecom-agent-data:
