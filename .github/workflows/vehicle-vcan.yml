name: Vehicle virtual CAN acceptance
on:
  workflow_dispatch:
  push:
    paths: ['src/telecom_incident_agent/vehicle*', 'scripts/verify_vcan.py', 'examples/vehicle.dbc', '.github/workflows/vehicle-vcan.yml']
  pull_request:
    paths: ['src/telecom_incident_agent/vehicle*', 'scripts/verify_vcan.py', 'examples/vehicle.dbc', '.github/workflows/vehicle-vcan.yml']
permissions:
  contents: read
jobs:
  vcan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Create virtual CAN interface
        run: |
          set -euo pipefail
          mkdir -p artifacts
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set vcan0 up
          ip -details link show vcan0 > artifacts/vcan-interface.txt
      - name: Receive and decode actual virtual bus frame
        run: |
          set -euo pipefail
          python scripts/verify_vcan.py --output artifacts/linux-vcan.json
          python scripts/demo_vehicle.py --output artifacts/vehicle-baseline.json
          python -m pytest tests/test_vehicle.py tests/test_vehicle_planner.py -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-vcan-linux-evidence
          path: artifacts/
