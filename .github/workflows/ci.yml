name: telecom-agent-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ros2-workcell:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Build ROS interfaces and set up the runtime
        run: |
          apt-get update
          apt-get install -y python3-venv python3-colcon-common-extensions
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths ros2
          python3 -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -e .
      - name: Verify topic, service and Runtime Action completion and cancellation
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          export ROS_LOCALHOST_ONLY=1
          mkdir -p artifacts
          ros2 run industrial_robot_sim workcell_sim > artifacts/workcell.log 2>&1 &
          simulator=$!
          trap 'kill "$simulator" 2>/dev/null || true' EXIT
          timeout 25s ros2 topic echo /workcell/status --once | tee artifacts/topic.txt
          timeout 25s ros2 service call /workcell/get_status std_srvs/srv/Trigger '{}' | tee artifacts/service.txt
          .venv/bin/python scripts/demo_ros_runtime.py --allow-simulation --checkpoint artifacts/ros.sqlite3 > artifacts/completed.json
          .venv/bin/python scripts/demo_ros_runtime.py --allow-simulation --cancel-after 3 --checkpoint artifacts/ros.sqlite3 > artifacts/canceled.json
          .venv/bin/python -c 'import json; from pathlib import Path; a,b=(json.loads(Path("artifacts", f+".json").read_text())["result"]["inspection"] for f in ("completed","canceled")); assert a["outcome"]=="completed" and a["inspected"]==8 and a["feedback"]; assert b["outcome"]=="canceled" and 0<b["inspected"]<8 and b["feedback"]'
          .venv/bin/python scripts/demo_robot_agent.py --ros2 --baseline --data-dir artifacts/robot --output artifacts/robot-completed.json
          .venv/bin/python scripts/demo_robot_agent.py --ros2 --baseline --cancel-after 1 --data-dir artifacts/robot --output artifacts/robot-canceled.json
          .venv/bin/python -c 'import json; from pathlib import Path; a=json.loads(Path("artifacts/robot-completed.json").read_text()); b=json.loads(Path("artifacts/robot-canceled.json").read_text()); assert a["task"]["state"]=="completed"; assert b["task"]["state"]=="canceled"; assert a["task"]["result"]["data_boundary"]=="ros2_logic_simulation"'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ros2-workcell-evidence
          path: artifacts/

  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python scripts/generate_dataset.py
      - run: git diff --exit-code -- data/evaluation/telecom_eval_v1.jsonl data/evaluation/telecom_eval_v1_manifest.json
      - run: python scripts/evaluate.py
      - run: python scripts/evaluate_failures.py
      - run: python scripts/evaluate_rag.py
      - run: python scripts/evaluate_v2_frozen.py
      - run: python scripts/evaluate_v2_security_cohorts.py
      - run: python scripts/evaluate_robustness.py
      - run: python scripts/check_release_readiness.py

  compose-smoke:
    needs: test-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start six-service topology
        run: docker compose up -d --build
      - name: Wait for API and run one queued diagnosis
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Incident API did not become ready"
              exit 1
            fi
            sleep 2
          done
          response=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            --data-binary @examples/incident_optical.json \
            http://127.0.0.1:8000/v1/incidents)
          incident_id=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["incident_id"])')
          for attempt in $(seq 1 45); do
            status=$(curl --fail --silent "http://127.0.0.1:8000/v1/incidents/$incident_id" | python -c 'import json,sys; print(json.load(sys.stdin)["runtime_status"])')
            if [ "$status" = "completed" ]; then
              break
            fi
            if [ "$status" = "worker_failed" ] || [ "$attempt" -eq 45 ]; then
              echo "Diagnosis ended with status: $status"
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent "http://127.0.0.1:8000/v1/incidents/$incident_id/trace" >/dev/null
          curl --fail --silent http://127.0.0.1:8000/trace-ui >/dev/null
          curl --fail --silent http://127.0.0.1:8000/metrics >/dev/null
          curl --fail --silent http://127.0.0.1:9090/-/ready >/dev/null
      - name: Show Compose diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop Compose topology
        if: always()
        run: docker compose down --volumes --remove-orphans

  postgres-takeover:
    needs: test-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: telecom
          POSTGRES_USER: telecom
          POSTGRES_PASSWORD: telecom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telecom -d telecom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TELECOM_POSTGRES_INTEGRATION_DSN: postgresql://telecom:telecom@localhost:5432/telecom
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,deploy]"
      - name: Verify expired-lease takeover and fencing on real PostgreSQL
        run: python -m pytest -q tests/test_postgres_takeover_integration.py

  redis-reliability:
    needs: test-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TELECOM_REDIS_INTEGRATION_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,deploy]"
      - name: Verify pending reclaim, acknowledgement and dead-letter routing
        run: python -m pytest -q tests/test_redis_reliability_integration.py
