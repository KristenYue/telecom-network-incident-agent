name: telecom-agent-ci

on:
  push:
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python scripts/generate_dataset.py
      - run: git diff --exit-code -- data/evaluation/telecom_eval_v1.jsonl data/evaluation/telecom_eval_v1_manifest.json
      - run: python scripts/evaluate.py
      - run: python scripts/evaluate_failures.py
      - run: python scripts/evaluate_rag.py
      - run: python scripts/check_release_readiness.py

  compose-smoke:
    needs: test-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start six-service topology
        run: docker compose up -d --build
      - name: Wait for API and run one queued diagnosis
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Incident API did not become ready"
              exit 1
            fi
            sleep 2
          done
          response=$(curl --fail --silent \
            -H 'Content-Type: application/json' \
            --data-binary @examples/incident_optical.json \
            http://127.0.0.1:8000/v1/incidents)
          incident_id=$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["incident_id"])')
          for attempt in $(seq 1 45); do
            status=$(curl --fail --silent "http://127.0.0.1:8000/v1/incidents/$incident_id" | python -c 'import json,sys; print(json.load(sys.stdin)["runtime_status"])')
            if [ "$status" = "completed" ]; then
              break
            fi
            if [ "$status" = "worker_failed" ] || [ "$attempt" -eq 45 ]; then
              echo "Diagnosis ended with status: $status"
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent "http://127.0.0.1:8000/v1/incidents/$incident_id/trace" >/dev/null
          curl --fail --silent http://127.0.0.1:8000/trace-ui >/dev/null
          curl --fail --silent http://127.0.0.1:8000/metrics >/dev/null
          curl --fail --silent http://127.0.0.1:9090/-/ready >/dev/null
      - name: Show Compose diagnostics
        if: failure()
        run: docker compose ps && docker compose logs --no-color
      - name: Stop Compose topology
        if: always()
        run: docker compose down --volumes --remove-orphans
